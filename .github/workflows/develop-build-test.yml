name: develop-build-test

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: develop-build-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  develop-build-test:
    name: develop-build-test
    runs-on: ubuntu-latest
    steps:
      - name: Reject main to develop PR
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          if [ "$BASE_REF" = "develop" ] && [ "$HEAD_REF" = "main" ]; then
            echo "::error::develop 브랜치 PR은 main 외의 작업 브랜치에서만 생성할 수 있습니다."
            exit 1
          fi

          echo "develop PR source branch guard passed."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build, test, and generate coverage report
        run: ./gradlew clean build jacocoTestReport

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          flags: backend
          name: monew-backend
          fail_ci_if_error: true
