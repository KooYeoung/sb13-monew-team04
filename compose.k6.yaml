services:
  k6:
    image: grafana/k6:0.54.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      K6_SCRIPT: ${K6_SCRIPT:-/scripts/activity-history-baseline.js}
      K6_BASE_URL: ${K6_BASE_URL:-http://host.docker.internal:8080}
      K6_ACTIVITY_HISTORY_PATH_TEMPLATE: ${K6_ACTIVITY_HISTORY_PATH_TEMPLATE:-/api/user-activities/{userId}}
      K6_VARIANT: ${K6_VARIANT:-rdb}
      K6_TICKET: ${K6_TICKET:-MID4-206}
      K6_RUN_INDEX: ${K6_RUN_INDEX:-1}
      K6_TARGET_USER_ID: ${K6_TARGET_USER_ID:-00000001-0000-4000-8000-000000000001}
      K6_TARGET_USER_IDS: ${K6_TARGET_USER_IDS:-}
      K6_USER_PICK_STRATEGY: ${K6_USER_PICK_STRATEGY:-single}
      K6_USER_ID_HEADER_NAME: ${K6_USER_ID_HEADER_NAME:-Monew-Request-User-ID}
      K6_MIX_RATIO: ${K6_MIX_RATIO:-80/20}
      K6_MIX_ARTICLE_IDS: ${K6_MIX_ARTICLE_IDS:-}
      K6_MIX_COMMENT_IDS: ${K6_MIX_COMMENT_IDS:-}
      K6_MIX_INTEREST_IDS: ${K6_MIX_INTEREST_IDS:-}
      K6_MIX_WRITE_USER_IDS: ${K6_MIX_WRITE_USER_IDS:-}
      K6_EXPECTED_STATUS: ${K6_EXPECTED_STATUS:-200}
      K6_SCENARIO: ${K6_SCENARIO:-smoke}
      K6_SMOKE_VUS: ${K6_SMOKE_VUS:-1}
      K6_SMOKE_DURATION: ${K6_SMOKE_DURATION:-1m}
      K6_BASELINE_VUS: ${K6_BASELINE_VUS:-20}
      K6_BASELINE_DURATION: ${K6_BASELINE_DURATION:-5m}
      K6_AVERAGE_VUS: ${K6_AVERAGE_VUS:-50}
      K6_AVERAGE_DURATION: ${K6_AVERAGE_DURATION:-10m}
      K6_HIGH_LOAD_VUS: ${K6_HIGH_LOAD_VUS:-100}
      K6_HIGH_LOAD_DURATION: ${K6_HIGH_LOAD_DURATION:-10m}
      K6_STRESS_START_VUS: ${K6_STRESS_START_VUS:-0}
      K6_STRESS_STAGES: ${K6_STRESS_STAGES:-3m:50,3m:100,3m:200,3m:400}
      K6_STRESS_GRACEFUL_RAMP_DOWN: ${K6_STRESS_GRACEFUL_RAMP_DOWN:-30s}
      K6_THROUGHPUT_RATE: ${K6_THROUGHPUT_RATE:-50}
      K6_THROUGHPUT_TIME_UNIT: ${K6_THROUGHPUT_TIME_UNIT:-1s}
      K6_THROUGHPUT_DURATION: ${K6_THROUGHPUT_DURATION:-1m}
      K6_THROUGHPUT_PRE_ALLOCATED_VUS: ${K6_THROUGHPUT_PRE_ALLOCATED_VUS:-500}
      K6_THROUGHPUT_MAX_VUS: ${K6_THROUGHPUT_MAX_VUS:-500}
      K6_HTTP_REQ_FAILED_RATE_THRESHOLD: ${K6_HTTP_REQ_FAILED_RATE_THRESHOLD:-0.01}
      K6_HTTP_REQ_DURATION_P95_THRESHOLD: ${K6_HTTP_REQ_DURATION_P95_THRESHOLD:-200}
      K6_HTTP_REQ_DURATION_P99_THRESHOLD: ${K6_HTTP_REQ_DURATION_P99_THRESHOLD:-500}
      K6_CHECK_RATE_THRESHOLD: ${K6_CHECK_RATE_THRESHOLD:-0.99}
      K6_DROPPED_ITERATIONS_COUNT_THRESHOLD: ${K6_DROPPED_ITERATIONS_COUNT_THRESHOLD:-1}
      K6_SLEEP_SECONDS: ${K6_SLEEP_SECONDS:-1}
      K6_SUMMARY_PATH: ${K6_SUMMARY_PATH:-}
      K6_AUTHORIZATION: ${K6_AUTHORIZATION:-}
    volumes:
      - ./scripts/performance/activity-history/k6:/scripts:ro
      - ./scripts/performance/activity-history/k6/results:/results
    command:
      - run
      - ${K6_SCRIPT:-/scripts/activity-history-baseline.js}
