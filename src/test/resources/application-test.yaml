spring:
  datasource:
    url: jdbc:h2:mem:monew-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false
  h2:
    console:
      enabled: false

logging:
  level:
    root: info
    com.codeit.sb13.monew: debug

    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.batch: trace
    org.hibernate.orm.jdbc.bind: off

monew:
  s3:
    bucket: monew-test-backup
    region: ap-northeast-2
    endpoint:
    prefix: article-backups
  backup:
    schedule:
      enabled: false
      cron: "0 10 0 * * *"
