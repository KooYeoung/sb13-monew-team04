spring:
  datasource:
    url: jdbc:postgresql://${MONEW_DB_HOST}:${MONEW_DB_PORT:5432}/${MONEW_DB_NAME}
    username: ${MONEW_DB_USERNAME}
    password: ${MONEW_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${MONEW_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: ${MONEW_FLYWAY_ENABLED:true}
  mongodb:
    uri: ${MONEW_MONGODB_URI:mongodb://localhost:27017/monew}
  docker:
    compose:
      enabled: false

server:
  port: ${MONEW_SERVER_PORT:8080}

logging:
  level:
    root: info
    com.codeit.sb13.monew: info

    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.batch: warn
    org.hibernate.orm.jdbc.bind: warn

monew:
  mongodb:
    enabled: ${MONEW_MONGODB_ENABLED:false}
    initialize-indexes: ${MONEW_MONGODB_INITIALIZE_INDEXES:true}
    worker:
      enabled: ${MONEW_MONGODB_WORKER_ENABLED:false}
      fixed-delay-ms: ${MONEW_MONGODB_WORKER_FIXED_DELAY_MS:1000}
      batch-size: ${MONEW_MONGODB_WORKER_BATCH_SIZE:100}
      claim-lease: ${MONEW_MONGODB_WORKER_CLAIM_LEASE:5m}
      heartbeat-interval: ${MONEW_MONGODB_WORKER_HEARTBEAT_INTERVAL:1m}
  openapi:
    server-url: ${MONEW_OPENAPI_SERVER_URL}
    server-description: 운영 배포 서버
