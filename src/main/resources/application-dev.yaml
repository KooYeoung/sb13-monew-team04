spring:
  config:
    import: optional:file:.env.dev[.properties]
  datasource:
    url: jdbc:postgresql://${MONEW_DB_HOST:localhost}:${MONEW_DB_PORT:5432}/${MONEW_DB_NAME:monew}
    username: ${MONEW_DB_USERNAME:monew}
    password: ${MONEW_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${MONEW_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${MONEW_JPA_FORMAT_SQL:true}
    show-sql: ${MONEW_JPA_SHOW_SQL:false}
  flyway:
    enabled: ${MONEW_FLYWAY_ENABLED:true}
  docker:
    compose:
      enabled: ${MONEW_DOCKER_COMPOSE_ENABLED:true}
      arguments:
        - "--env-file"
        - ".env.dev"

server:
  port: ${MONEW_SERVER_PORT:8080}

logging:
  level:
    root: info
    com.codeit.sb13.monew: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.batch: trace
    org.hibernate.orm.jdbc.bind: off

monew:
  openapi:
    server-url: http://localhost:${server.port:8080}
    server-description: 로컬 개발 서버
