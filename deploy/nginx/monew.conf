# EC2에 설치한 Nginx가 사용할 reverse proxy 설정.
# /etc/nginx/sites-available/monew 로 복사한 뒤 sites-enabled에 심볼릭 링크로 연결해서 쓴다.
#
# 지금은 도메인이 없으므로 IP로 접속하지만, 앱 컨테이너를 80번 포트에 직접 물리지 않고
# 굳이 Nginx를 앞에 두는 이유는 두 가지다.
#   1) 나중에 도메인을 연결하고 certbot으로 HTTPS(443)를 추가할 때, 이 파일 하나만 손대면 된다.
#   2) 정적 파일 캐싱, 요청 제한(rate limit), 여러 컨테이너로의 라우팅 같은 것도
#      Spring Boot 앱 코드를 건드리지 않고 이 계층에서 처리할 수 있다.

server {
    listen 80;
    listen [::]:80;
    server_name _;  # 도메인이 없으므로 Host 헤더와 무관하게 이 서버 블록이 기본으로 응답한다.

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # 클라이언트가 요청한 원래 Host를 애플리케이션에 그대로 전달한다.
        # (안 넘기면 Spring Boot 입장에서는 항상 요청이 localhost에서 온 것처럼 보인다)
        proxy_set_header Host $host;

        # 클라이언트의 실제 IP. Nginx를 거치면 접속 IP가 127.0.0.1로 보이므로,
        # 로그나 접근 제어에서 진짜 클라이언트 IP가 필요하면 이 헤더를 봐야 한다.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 나중에 HTTPS를 붙였을 때, 앱이 "이 요청이 원래 http였는지 https였는지" 알 수 있게 해준다.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
