# EC2에 설치한 Nginx가 사용할 reverse proxy 설정.
# /etc/nginx/sites-available/monew 로 복사한 뒤 sites-enabled에 심볼릭 링크로 연결해서 쓴다.
#
# boxbox.kr 도메인을 연결하고 certbot으로 HTTPS(443)까지 적용한 상태다. HTTP(80)로 들어온
# 요청은 두 번째 server 블록에서 전부 HTTPS로 301 리다이렉트된다.
# 이렇게 굳이 Nginx를 앱 앞에 두는 이유는 두 가지다.
#   1) 인증서 갱신이나 리다이렉트 정책처럼 배포 계층의 변경을 이 파일 하나로 처리할 수 있다.
#   2) 정적 파일 캐싱, 요청 제한(rate limit), 여러 컨테이너로의 라우팅 같은 것도
#      Spring Boot 앱 코드를 건드리지 않고 이 계층에서 처리할 수 있다.
#
# 아래 "managed by Certbot" 표시가 붙은 줄들은 `certbot --nginx -d boxbox.kr -d www.boxbox.kr`
# 실행 시 certbot이 자동으로 추가/관리하는 부분이다. 인증서를 다시 발급하거나 서버를 새로
# 세팅할 때는 이 파일을 그대로 복사해두더라도, certbot을 한 번 더 실행해서 인증서 자체는
# 새로 받아야 한다.

server {
    server_name boxbox.kr www.boxbox.kr;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # 클라이언트가 요청한 원래 Host를 애플리케이션에 그대로 전달한다.
        # (안 넘기면 Spring Boot 입장에서는 항상 요청이 localhost에서 온 것처럼 보인다)
        proxy_set_header Host $host;

        # 클라이언트의 실제 IP. Nginx를 거치면 접속 IP가 127.0.0.1로 보이므로,
        # 로그나 접근 제어에서 진짜 클라이언트 IP가 필요하면 이 헤더를 봐야 한다.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # HTTPS를 앞단에서 처리하므로, 앱이 "이 요청이 원래 http였는지 https였는지" 알 수 있게 해준다.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/boxbox.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/boxbox.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.boxbox.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = boxbox.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name boxbox.kr www.boxbox.kr;
    return 404; # managed by Certbot
}
