services:
  postgres:
    image: 'postgres:16'
    environment:
      POSTGRES_DB: ${MONEW_DB_NAME:-monew}
      POSTGRES_USER: ${MONEW_DB_USERNAME:-monew}
      POSTGRES_PASSWORD: ${MONEW_DB_PASSWORD:-change-me}
    ports:
      - '${MONEW_DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${MONEW_DB_USERNAME:-monew} -d ${MONEW_DB_NAME:-monew}']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-seed:
    image: 'postgres:16'
    profiles:
      - perf-seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${MONEW_DB_PASSWORD:-change-me}
      MONEW_DB_NAME: ${MONEW_DB_NAME:-monew}
      MONEW_DB_USERNAME: ${MONEW_DB_USERNAME:-monew}
      SEED_SCALE: ${SEED_SCALE:-100k}
    volumes:
      - ./scripts/performance/activity-history:/seed:ro
    command: >
      sh -c '
        case "$$SEED_SCALE" in
          100k|1m|10m) ;;
          *) echo "SEED_SCALE must be one of: 100k, 1m, 10m" >&2; exit 1 ;;
        esac;
        cat "/seed/seed-common.sql" "/seed/seed-$$SEED_SCALE.sql" |
          psql -h postgres -U "$$MONEW_DB_USERNAME" -d "$$MONEW_DB_NAME" -v ON_ERROR_STOP=1
      '

  mongodb:
    image: 'mongo:8.0'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONEW_MONGODB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONEW_MONGODB_ROOT_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONEW_MONGODB_DATABASE:-monew}
      MONEW_MONGODB_APP_USERNAME: ${MONEW_MONGODB_APP_USERNAME:-}
      MONEW_MONGODB_APP_PASSWORD: ${MONEW_MONGODB_APP_PASSWORD:-}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        : "$${MONGO_INITDB_ROOT_USERNAME:?MONEW_MONGODB_ROOT_USERNAME is required}"
        : "$${MONGO_INITDB_ROOT_PASSWORD:?MONEW_MONGODB_ROOT_PASSWORD is required}"
        : "$${MONEW_MONGODB_APP_USERNAME:?MONEW_MONGODB_APP_USERNAME is required}"
        : "$${MONEW_MONGODB_APP_PASSWORD:?MONEW_MONGODB_APP_PASSWORD is required}"
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    command: ['mongod']
    ports:
      - '127.0.0.1:${MONEW_MONGODB_PORT:-27017}:27017'
    volumes:
      - mongodb-data:/data/db
      - ./scripts/mongodb/init-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 })"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  mongodb-data:
